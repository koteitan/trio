# Ytosk 氏の翻訳写像（BMS 行列 → 拡張 Buchholz の項）と、その項の順序の整礎性。
# trio の Lean（../../lean）には依存しない。Mathlib だけを、trio パッケージ経由で借りる。
name = "ytosk"
defaultTargets = ["Ytosk"]

[[require]]
name = "trio"
path = "../../lean"

[[lean_lib]]
name = "Ytosk"
roots = ["Ytosk.Term", "Ytosk.OT", "Ytosk.Eval", "Ytosk.Order", "Ytosk.Basic", "Ytosk.OTLemmas", "Ytosk.Dist", "Ytosk.WF", "Ytosk.BMS", "Ytosk.Arith", "Ytosk.Eval2", "Ytosk.SF", "Ytosk.Omega", "Ytosk.SP", "Ytosk.Chain", "Ytosk.Bridge", "Ytosk.TwoRow", "Ytosk.FS", "Ytosk.SPFS", "Ytosk.ExpGexp", "Ytosk.FSD", "Ytosk.Val", "Ytosk.Prefix", "Ytosk.Path", "Ytosk.TwoRowT", "Ytosk.SPFSD", "Ytosk.TwoRowP", "Ytosk.FSS", "Ytosk.TwoRowC", "Ytosk.TwoRowA", "Ytosk.TwoRowS", "Ytosk.TwoRowF", "Ytosk.TwoRowL", "Ytosk.TwoRowW", "Ytosk.F1", "Ytosk.TwoRowQ", "Ytosk.TwoRowR", "Ytosk.TwoRowZ", "Ytosk.TwoRowZ2", "Ytosk.TwoRowE", "Ytosk.TwoRowD", "Ytosk.TwoRowZ3", "Ytosk.TwoRowZ4", "Ytosk.TwoRowN", "Ytosk.TwoRowFin", "Ytosk.TwoRowI", "Ytosk.TwoRowX", "Ytosk.TwoRowY", "Ytosk.TwoRowV", "Ytosk.TwoRowU", "Ytosk.TwoRowK", "Ytosk.TwoRowJ", "Ytosk.TwoRowI2", "Ytosk.TwoRowI3", "Ytosk.TwoRowFin2", "Ytosk.TwoRowDiag", "Ytosk.V3Exist", "Ytosk.V3Dep", "Ytosk.V3Frame", "Ytosk.V3Path", "Ytosk.V3Omega", "Ytosk.V3Bump", "Ytosk.V3Chain", "Ytosk.V3Copy1", "Ytosk.V3Copy2", "Ytosk.V3Copy3", "Ytosk.V3Copy4", "Ytosk.V3Copy5"]
