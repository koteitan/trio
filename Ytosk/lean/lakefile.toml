# Ytosk 氏の翻訳写像（BMS 行列 → 拡張 Buchholz の項）と、その項の順序の整礎性。
# trio の Lean（../../lean）には依存しない。Mathlib だけを、trio パッケージ経由で借りる。
name = "ytosk"
defaultTargets = ["Ytosk"]

[[require]]
name = "trio"
path = "../../lean"

[[lean_lib]]
name = "Ytosk"
roots = ["Ytosk.Term", "Ytosk.OT", "Ytosk.Eval", "Ytosk.Order", "Ytosk.Basic", "Ytosk.OTLemmas", "Ytosk.Dist", "Ytosk.WF", "Ytosk.BMS", "Ytosk.Arith", "Ytosk.Eval2", "Ytosk.SF", "Ytosk.Omega", "Ytosk.SP", "Ytosk.Chain", "Ytosk.Bridge", "Ytosk.TwoRow", "Ytosk.FS", "Ytosk.SPFS", "Ytosk.ExpGexp"]
